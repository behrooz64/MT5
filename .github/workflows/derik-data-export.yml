name: Export Derik observer datasets

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Derik branch with Git LFS
        uses: actions/checkout@v4
        with:
          ref: Derik
          lfs: true

      - name: Verify and download LFS data
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          count=$(find Derik-Data/M1 Derik-Data/M5 -maxdepth 1 -type f -name '*.csv' | wc -l)
          echo "CSV files found: $count"
          test "$count" -eq 22
          for file in Derik-Data/M1/*.csv Derik-Data/M5/*.csv; do
            if head -n 1 "$file" | grep -q '^version https://git-lfs.github.com/spec/v1$'; then
              echo "LFS pointer remains instead of file content: $file"
              exit 1
            fi
          done

      - name: Package M1 and M5 datasets
        run: zip -r Derik-Data-M1-M5.zip Derik-Data/M1 Derik-Data/M5

      - name: Upload downloadable archive
        uses: actions/upload-artifact@v4
        with:
          name: Derik-Data-M1-M5
          path: Derik-Data-M1-M5.zip
          if-no-files-found: error
          retention-days: 7
