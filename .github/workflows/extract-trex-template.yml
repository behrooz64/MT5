name: Extract TRex template archive

on:
  push:
    branches:
      - TRX
    paths:
      - ".github/workflows/extract-trex-template.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TRX
        uses: actions/checkout@v4
        with:
          ref: TRX
          persist-credentials: true

      - name: Extract archive into a dedicated folder
        shell: bash
        run: |
          set -euo pipefail
          archive="TRex-Template-(KohanFx.com).zip"
          test -f "$archive"
          mkdir -p /tmp/trex-archive
          unzip -q "$archive" -d /tmp/trex-archive
          mapfile -t top_items < <(find /tmp/trex-archive -mindepth 1 -maxdepth 1 -print)
          if [ "${#top_items[@]}" -eq 1 ] && [ -d "${top_items[0]}" ]; then
            source_dir="${top_items[0]}"
          else
            source_dir="/tmp/trex-archive"
          fi
          destination="TRex-Template-(KohanFx.com)-extracted"
          mkdir -p "$destination"
          cp -a "$source_dir"/. "$destination"/
          test "$(find "$destination" -type f | wc -l)" -gt 0

      - name: Commit extracted files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "TRex-Template-(KohanFx.com)-extracted"
          git rm -- ".github/workflows/extract-trex-template.yml"
          git commit -m "Extract TRex template archive on TRX"
          git push origin HEAD:TRX
